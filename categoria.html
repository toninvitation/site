<!-- Página automática de categoria. -->
<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Categoria — TONInvitation</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Allura&family=Cormorant+Garamond:wght@300;400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="style.css" rel="stylesheet" />
    <link href="categoria.css" rel="stylesheet" />
  </head>
  <body class="category-page-body">
    <header class="site-header">
      <a class="logo" href="index.html"
        ><img alt="TONInvitation" src="Images/logo_pt.png"
      /></a>
      <nav class="main-nav" id="menu">
        <ul>
          <li><a href="index.html">Início</a></li>
          <li><a href="index.html#catalogo">Catálogo</a></li>
          <li><a href="index.html#como-funciona">Como funciona</a></li>
          <li><a href="index.html#contactos">Contactos</a></li>
        </ul>
      </nav>
      <a
        class="btn btn-primary header-contact"
        href="https://wa.link/jy0xch"
        target="_blank"
        >Contactar</a
      >
      <div class="language-selector">
        <button
          type="button"
          class="language-current"
          aria-label="Choose language"
        >
          🇵🇹 PT
        </button>
        <div class="language-menu">
          <button type="button" class="language-option" data-language="pt">
            🇵🇹 PT
          </button>
          <button type="button" class="language-option" data-language="en">
            🇬🇧 EN
          </button>
          <button type="button" class="language-option" data-language="fr">
            🇫🇷 FR
          </button>
          <button type="button" class="language-option" data-language="es">
            🇪🇸 ES
          </button>
        </div>
      </div>
      <button class="menu-mobile" id="menu-mobile" aria-label="Abrir menu">
        <span></span><span></span><span></span>
      </button>
    </header>

    <main class="category-page">
      <a class="back-link" href="index.html#catalogo"
        ><i data-lucide="arrow-left"></i>Voltar</a
      >
      <div id="category-header"></div>
      <div id="category-content"></div>
      <p data-catalog-error class="form-message"></p>
    </main>

    <script src="i18n.js"></script>
    <script src="categories.js"></script>
    <script src="categoria.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
